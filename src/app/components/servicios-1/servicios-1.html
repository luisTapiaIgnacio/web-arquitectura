<section id="servicioss">
  <div class="container">
    <div class="row g-5 align-items-center">
      <!-- ══════════════════════════════
           COLUMNA DERECHA
      ══════════════════════════════ -->
      <div class="col-lg-6">
        <!-- ELABORACIÓN DE PLANOS -->
        <div class="mb-4">
          <div class="gold-line"></div>
          <h2 class="sec-title">ELABORACIÓN DE <br> EXPEDIENTES PARA</h2>
          <ul class="check-list">
            <li *ngFor="let item of planosItems">
              <i class="bi bi-check-circle-fill"></i> {{ item }}
            </li>
          </ul>
        </div>

        <!-- DISEÑO Y REMODELACIONES -->
        <div class="mb-5">
          <div class="gold-line"></div>
          <h2 class="sec-title">TRÁMITES EN SUNARP Y MUNICIPALIDADES</h2>
          <p class="desc-text">
            Gestión integral de registros y licencias para sus proyectos de arquitectura y construcción.
          </p>
          
        </div>
      </div>
      <!-- ══════════════════════════════
           COLUMNA IZQUIERDA
      ══════════════════════════════ -->
      <div class="col-12 col-md-6">
        <div class="col-video">
          <!-- Badge superior izquierdo — imagen PNG -->
          <a
            href="https://www.tiktok.com/@estudio_tapia"
            target="_blank"
            rel="noopener"
            class="badge-proyectos"
          >
            <img src="assets/images/tiktok-icono.png" alt="TikTok Estudio Tapia" />
          </a>

          <!-- Flecha superior — imagen PNG -->
          <div class="flecha-top">
            <img src="assets/images/flecha-1.png" alt="flecha" />
          </div>

          <!-- Tarjeta de video -->
          <!-- Tarjeta de video -->
          <div class="video-card">
            <video #videoRef muted loop playsinline poster="assets/images/post-2.jpg">
              <source src="assets/videos/VID-EDIT-2.m4v" type="video/mp4" />
            </video>

            <!-- Botón play/pause -->
            <button class="play-btn" (click)="toggleVideo(videoRef, btnRef)" #btnRef>
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
            </button>
          </div>

          <!-- Flecha inferior — misma imagen rotada con CSS -->
          <div class="flecha-bottom">
            <img src="assets/images/flecha.png" alt="flecha" />
          </div>

          <!-- Badge inferior derecho — imagen PNG -->
          <a
            href="https://www.facebook.com/profile.php?id=100051507202783"
            target="_blank"
            rel="noopener"
            class="badge-anos"
          >
            <img src="assets/images/fb-icono.png" alt="Facebook Estudio Tapia" />
          </a>
        </div>
        <!-- /col-video -->
      </div>
    </div>
  </div>
</section>
